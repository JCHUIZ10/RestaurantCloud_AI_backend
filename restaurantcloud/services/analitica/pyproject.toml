[project]
name = "restaurantcloud-analitica"
version = "0.1.0"
description = "ms-analítica: reportes de ventas y series para la IA de RestaurantCloud"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
# Es una aplicación, no una librería: no se empaqueta ni se instala a sí misma.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
