[project]
name = "restaurantcloud-pronostico"
version = "0.1.0"
description = "ms-pronóstico: pronóstico de demanda por plato para RestaurantCloud"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "tzdata>=2024.2",
    "httpx>=0.27",
    # La misma versión que usó model-ia para los feriados del entrenamiento (cuaderno 02).
    "holidays==0.109",
    # Adaptador gs:// para el repositorio de modelos en Cloud Storage (etapa 8).
    "google-cloud-storage>=2.18",
    # Cálculo del pronóstico, compartido con model-ia (D-02). Trae scikit-learn==1.7.2 y skops==0.13.0.
    "rc-pronostico",
    # Mismas versiones que model-ia/uv.lock: el modelo se entrenó con ellas.
    "numpy==2.5.5",
    "pandas==3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
# Es una aplicación, no una librería: no se empaqueta ni se instala a sí misma.
package = false

[tool.uv.sources]
# Una sola copia del código de las variables (D-02). La ruta es relativa a este archivo; el Dockerfile
# reproduce la misma disposición de carpetas para que uv.lock valga dentro de la imagen.
rc-pronostico = { path = "../../../model-ia/rc_pronostico" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
