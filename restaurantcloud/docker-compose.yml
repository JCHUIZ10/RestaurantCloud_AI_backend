name: restaurantcloud-ia

services:
  db:
    image: postgres:16-alpine
    container_name: restaurantcloudIA_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      PGCLIENTENCODING: "UTF8"  
    command:
      - "postgres"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "min_wal_size=512MB"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "track_io_timing=on"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_parallel_workers_per_gather=2"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  redis:
    image: redis:7-alpine
    container_name: restaurantcloudIA_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: restaurantcloudIA_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: restaurantcloudIA_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
        mc mb local/${MINIO_DEFAULT_BUCKET:-restaurantcloud} --ignore-existing
        mc anonymous set download local/${MINIO_DEFAULT_BUCKET:-restaurantcloud}/catalogo
        exit 0
    networks:
      - saas_network

  api:
    build:
      context: .
      dockerfile: ./infra/docker/api.Dockerfile
    container_name: restaurantcloudIA_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CONTAINER_ROLE: api
      APP_SERVER: ${APP_SERVER:-octane}
      OCTANE_WORKERS: ${OCTANE_WORKERS:-2}
      REDIS_CLIENT: phpredis
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_DEFAULT_BUCKET:-restaurantcloud}
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: ${AWS_URL:-http://localhost:9000/restaurantcloud}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      FILESYSTEM_DISK: s3
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ANALITICA_URL: ${ANALITICA_URL:-http://analitica:8001}
      ANALITICA_SECRETO: ${ANALITICA_SECRETO:-}
      NOTIFICACIONES_URL: ${NOTIFICACIONES_URL:-}
      NOTIFICACIONES_SECRETO: ${NOTIFICACIONES_SECRETO:-}
    volumes:

      - ./apps/api:/app
      # Contratos de forma de los eventos (doc-2u/servicios/contratos): las pruebas del núcleo los verifican.
      - ../doc-2u/servicios/contratos:/contratos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network

  queue:
    build:
      context: .
      dockerfile: ./infra/docker/api.Dockerfile
    container_name: restaurantcloudIA_queue
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: queue
      REDIS_CLIENT: phpredis
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_DEFAULT_BUCKET:-restaurantcloud}
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: ${AWS_URL:-http://localhost:9000/restaurantcloud}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      FILESYSTEM_DISK: s3
      # El worker envía los eventos del outbox a los microservicios.
      ANALITICA_URL: ${ANALITICA_URL:-http://analitica:8001}
      ANALITICA_SECRETO: ${ANALITICA_SECRETO:-}
      NOTIFICACIONES_URL: ${NOTIFICACIONES_URL:-}
      NOTIFICACIONES_SECRETO: ${NOTIFICACIONES_SECRETO:-}
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - saas_network

  scheduler:
    build:
      context: .
      dockerfile: ./infra/docker/api.Dockerfile
    container_name: restaurantcloudIA_scheduler
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: scheduler
      REDIS_CLIENT: phpredis
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - saas_network

  # ---------------------------------------------------------------------------
  # Bases de datos de los microservicios: una por servicio, cada una en su contenedor.
  # ---------------------------------------------------------------------------
  db-analitica:
    image: postgres:16-alpine
    container_name: restaurantcloudIA_db_analitica
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ANALITICA_DB_NAME}
      POSTGRES_USER: ${ANALITICA_DB_USER}
      POSTGRES_PASSWORD: ${ANALITICA_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      # Los usa 01-usuarios.sh para crear el usuario de la aplicación (solo al inicializar el volumen).
      ANALITICA_DB_APP_USER: ${ANALITICA_DB_APP_USER}
      ANALITICA_DB_APP_PASSWORD: ${ANALITICA_DB_APP_PASSWORD}
    ports:
      - "${ANALITICA_DB_PORT:-5433}:5432"
    volumes:
      - analitica_data:/var/lib/postgresql/data
      - ./infra/postgres/analitica:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALITICA_DB_USER} -d ${ANALITICA_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  # ---------------------------------------------------------------------------
  # ms-analítica
  # ---------------------------------------------------------------------------
  # Corre una vez las migraciones con el usuario administrador y termina; así las credenciales
  # de administrador no quedan en el contenedor que atiende las peticiones.
  analitica-migraciones:
    build:
      context: ./services/analitica
    container_name: restaurantcloudIA_analitica_migraciones
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://${ANALITICA_DB_USER}:${ANALITICA_DB_PASSWORD}@db-analitica:5432/${ANALITICA_DB_NAME}
    depends_on:
      db-analitica:
        condition: service_healthy
    networks:
      - saas_network

  analitica:
    build:
      context: ./services/analitica
    container_name: restaurantcloudIA_analitica
    restart: unless-stopped
    ports:
      - "${ANALITICA_PORT:-8001}:8001"
    environment:
      PORT: 8001
      DATABASE_URL: postgresql+psycopg://${ANALITICA_DB_APP_USER}:${ANALITICA_DB_APP_PASSWORD}@db-analitica:5432/${ANALITICA_DB_NAME}
      SECRETO_INTERNO: ${ANALITICA_SECRETO}
      ZONA_HORARIA: America/Lima
    depends_on:
      analitica-migraciones:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  db-pronostico:
    image: postgres:16-alpine
    container_name: restaurantcloudIA_db_pronostico
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PRONOSTICO_DB_NAME}
      POSTGRES_USER: ${PRONOSTICO_DB_USER}
      POSTGRES_PASSWORD: ${PRONOSTICO_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      # Los usa 01-usuarios.sh para crear el usuario de la aplicación (solo al inicializar el volumen).
      PRONOSTICO_DB_APP_USER: ${PRONOSTICO_DB_APP_USER}
      PRONOSTICO_DB_APP_PASSWORD: ${PRONOSTICO_DB_APP_PASSWORD}
    ports:
      - "${PRONOSTICO_DB_PORT:-5434}:5432"
    volumes:
      - pronostico_data:/var/lib/postgresql/data
      - ./infra/postgres/pronostico:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRONOSTICO_DB_USER} -d ${PRONOSTICO_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  # ---------------------------------------------------------------------------
  # ms-pronóstico
  # ---------------------------------------------------------------------------
  # Corre una vez las migraciones con el usuario administrador y termina (igual que ms-analítica).
  # `model_ia` es el contexto adicional del que la imagen toma el paquete rc_pronostico.
  pronostico-migraciones:
    build:
      context: ./services/pronostico
      additional_contexts:
        model_ia: ../model-ia
    container_name: restaurantcloudIA_pronostico_migraciones
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://${PRONOSTICO_DB_USER}:${PRONOSTICO_DB_PASSWORD}@db-pronostico:5432/${PRONOSTICO_DB_NAME}
      # Usuario al que la migración 0002 concede sus permisos.
      APP_DB_USER: ${PRONOSTICO_DB_APP_USER}
    depends_on:
      db-pronostico:
        condition: service_healthy
    networks:
      - saas_network

  pronostico:
    build:
      context: ./services/pronostico
      additional_contexts:
        model_ia: ../model-ia
    container_name: restaurantcloudIA_pronostico
    restart: unless-stopped
    ports:
      - "${PRONOSTICO_PORT:-8002}:8002"
    environment:
      PORT: 8002
      DATABASE_URL: postgresql+psycopg://${PRONOSTICO_DB_APP_USER}:${PRONOSTICO_DB_APP_PASSWORD}@db-pronostico:5432/${PRONOSTICO_DB_NAME}
      SECRETO_INTERNO: ${PRONOSTICO_SECRETO}
      ZONA_HORARIA: America/Lima
      MODELOS_REPOSITORIO: file:///repositorio
    volumes:
      # Solo lectura: publicar modelos es tarea de model-ia (cuaderno 07), no del servicio.
      - ../model-ia/repositorio:/repositorio:ro
    depends_on:
      pronostico-migraciones:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  mongo-notificaciones:
    image: mongo:7
    container_name: restaurantcloudIA_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${NOTIFICACIONES_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${NOTIFICACIONES_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${NOTIFICACIONES_MONGO_DB}
    ports:
      - "${NOTIFICACIONES_MONGO_PORT:-27017}:27017"
    volumes:
      - notificaciones_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  analitica_data:
    driver: local
  pronostico_data:
    driver: local
  notificaciones_data:
    driver: local

networks:
  saas_network:
    driver: bridge
