<title>Reportes de ÁUREA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap">
<style>
/* Maqueta de CU-ADMIN-13 dentro de la consola de sede: sidebar navy, lienzo marfil,
   tarjetas blancas. Tema único claro, como las consolas de la app (darkMode: 'class'). */
:root {
  color-scheme: light;
  /* Marca ÁUREA (tailwind.config.ts) */
  --navy: #0B2340;
  --navy-2: #163A63;
  --cobre: #D5A06F;
  --champan: #F4D7B0;
  --marfil: #FFF9F0;
  --blanco: #FFFFFF;
  /* Texto: navy con opacidad, como las consolas */
  --tx: #0B2340;
  --tx-2: rgba(11, 35, 64, .72);
  --tx-3: rgba(11, 35, 64, .62);
  --borde: rgba(244, 215, 176, .85);
  --borde-suave: rgba(244, 215, 176, .5);
  --rejilla: rgba(11, 35, 64, .08);
  /* Paleta de datos validada (dataviz: CVD ΔE ≥ 8 en adyacentes, piso normal ≥ 15) */
  --s-azul: #2563A8;
  --s-cobre: #D97B2B;
  --s-turq: #0E9488;
  --s-terra: #C24A35;
  --s-ciruela: #8E3B8A;
  --s-oro: #C98F12;
  /* Estados (estado-ok/alerta/error) */
  --ok: #047857; --ok-bg: #ECFDF5;
  --alerta: #B45309; --alerta-bg: #FFFBEB;
  --error: #BE123C; --error-bg: #FFF1F2;
  --f-serif: "DM Serif Display", Georgia, serif;
  --f-sans: "DM Sans", Arial, system-ui, sans-serif;
  --r-tarjeta: 16px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--marfil); color: var(--tx); font-family: var(--f-sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--cobre); outline-offset: 2px; }
.cifra { font-variant-numeric: tabular-nums; }
svg.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Layout de consola ---------- */
.app { display: grid; grid-template-columns: 1fr; min-height: 100dvh; }
.sidebar { display: none; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; background: var(--navy); color: #fff; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--navy); }
.topbar .marca-txt { font-family: var(--f-serif); font-size: 17px; }
.topbar .seccion { margin-left: auto; font-size: 13px; color: var(--champan); }
@media (min-width: 1024px) {
  .app { grid-template-columns: 256px 1fr; }
  .topbar { display: none; }
  .sidebar { display: flex; flex-direction: column; position: sticky; top: 0; height: 100dvh; background: var(--navy); color: #fff; }
}
.sb-marca { display: flex; align-items: center; gap: 10px; padding: 20px 16px 6px; }
.sb-logo { width: 36px; height: 36px; border-radius: 10px; background: rgba(213,160,111,.2); border: 1px solid rgba(213,160,111,.4); display: grid; place-items: center; font-family: var(--f-serif); font-size: 18px; color: var(--champan); }
.sb-marca span { font-family: var(--f-serif); font-size: 18px; letter-spacing: .02em; }
.sb-sede { padding: 0 16px 14px 62px; font-size: 12px; color: rgba(244,215,176,.8); }
.sb-nav { flex: 1; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; border-top: 1px solid rgba(255,255,255,.08); }
.sb-grupo { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: rgba(244,215,176,.6); padding: 14px 12px 6px; }
.sb-item { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; color: rgba(255,255,255,.82); border: 0; background: none; text-align: left; }
.sb-item svg { color: var(--cobre); }
.sb-item:hover { background: rgba(255,255,255,.06); }
.sb-item.activo { background: var(--champan); color: var(--navy); font-weight: 600; }
.sb-item.activo svg { color: var(--navy); }
.sb-pie { border-top: 1px solid rgba(255,255,255,.1); padding: 12px; display: flex; align-items: center; gap: 10px; }
.sb-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--champan); color: var(--navy); display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 1px solid rgba(213,160,111,.5); }
.sb-pie b { display: block; font-size: 14px; }
.sb-pie small { font-size: 12px; color: rgba(244,215,176,.8); }

.main { min-width: 0; padding-block: 20px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 768px) { .main { padding-block: 28px 120px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); } }
@media (min-width: 1280px) { .main { padding-left: 32px; padding-right: 32px; } }

/* ---------- Encabezado y filtros ---------- */
.ph { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px; justify-content: space-between; }
.ph-titulo { display: flex; gap: 14px; align-items: center; min-width: 0; }
.ph-icono { width: 48px; height: 48px; border-radius: 14px; background: var(--navy); color: var(--champan); display: grid; place-items: center; flex: none; }
.ph-icono svg { width: 24px; height: 24px; }
.ph h1 { margin: 0; font-family: var(--f-serif); font-weight: 700; font-size: 28px; line-height: 1.1; text-wrap: balance; }
.ph p { margin: 4px 0 0; color: var(--tx-2); font-size: 14px; }
.frescura { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--tx-2); background: var(--blanco); border: 1px solid var(--borde); border-radius: 999px; padding: 6px 12px; }
.punto-vivo { width: 8px; height: 8px; border-radius: 50%; background: #10B981; box-shadow: 0 0 0 3px rgba(16,185,129,.18); }

.filtros { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--r-tarjeta); padding: 12px; box-shadow: 0 1px 2px rgba(11,35,64,.04); }
.segmentado { display: flex; gap: 4px; background: var(--marfil); border: 1px solid var(--borde-suave); border-radius: 12px; padding: 4px; overflow-x: auto; max-width: 100%; }
.segmentado button { border: 0; background: none; padding: 0 14px; min-height: 36px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--tx-2); white-space: nowrap; }
.segmentado button.activo { background: var(--navy); color: #fff; box-shadow: 0 1px 3px rgba(11,35,64,.25); }
.rango { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--tx); }
.rango svg { color: var(--s-cobre); }
.rango small { color: var(--tx-3); font-size: 13px; }
/* Un solo componente: el interruptor y, al activarlo, las fechas de inicio y fin con los días */
.comparar { margin-left: auto; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; background: #fff; border: 1px solid var(--borde); border-radius: 14px; padding: 4px; }
.comparar .interruptor { padding: 0 10px; color: var(--tx); font-weight: 500; }
.comparar-rango { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 6px 12px; border-radius: 10px; background: var(--marfil); border: 1px solid var(--borde-suave); }
.comparar-rango .fecha small { display: block; font-size: 12px; color: var(--tx-3); line-height: 1.2; }
.comparar-rango .fecha b { display: block; font-size: 14px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
.comparar-rango .ic { color: var(--tx-3); }
.comparar-rango .dias { font-size: 13px; font-weight: 700; color: var(--navy); background: var(--champan); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.muestra { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.muestra.actual { background: var(--navy); }
.muestra.previa { background: rgba(11,35,64,.22); border: 1px dashed rgba(11,35,64,.45); }
@media (max-width: 767px) { .comparar { margin-left: 0; width: 100%; } .comparar-rango { flex: 1 1 100%; } }
.interruptor { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--tx-2); border: 0; background: none; min-height: 44px; }
.interruptor .pista { width: 40px; height: 24px; border-radius: 999px; background: var(--s-turq); position: relative; transition: background .2s; }
.interruptor .pista::after { content: ""; position: absolute; top: 3px; left: 19px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .2s; }
.interruptor[aria-checked="false"] .pista { background: rgba(11,35,64,.2); }
.interruptor[aria-checked="false"] .pista::after { left: 3px; }

/* ---------- Pestañas ---------- */
.pestanas { margin-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pestana { position: relative; display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--borde); background: var(--blanco); border-radius: 14px; padding: 12px 14px; min-height: 64px; transition: box-shadow .15s, transform .15s; }
.pestana:hover { box-shadow: 0 4px 14px rgba(11,35,64,.08); }
.pestana .p-ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.pestana .p-ic svg { width: 20px; height: 20px; }
.pestana b { display: block; font-size: 15px; }
.pestana small { display: block; font-size: 13px; color: var(--tx-3); }
.pestana .candado { position: absolute; top: 10px; right: 10px; color: var(--tx-3); }
.pestana.activo { background: var(--navy); border-color: var(--navy); color: #fff; box-shadow: 0 8px 22px rgba(11,35,64,.22); }
.pestana.activo small { color: var(--champan); }
.pestana.activo .p-ic { background: rgba(244,215,176,.16) !important; color: var(--champan) !important; }
.pestana.activo .candado { color: var(--champan); }
@media (max-width: 640px) {
  .pestana { flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px; }
  .pestana small { display: none; }
  .pestana .p-ic { width: 32px; height: 32px; }
}

/* ---------- Tarjetas y rejillas ---------- */
.vista { margin-top: 20px; display: flex; flex-direction: column; gap: 16px; }
.fila { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 768px) { .fila.k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1280px) { .fila.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1024px) {
  .fila.h-k { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
  .fila.d2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .fila.d1-1 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fila.d3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.tarjeta { background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--r-tarjeta); padding: 18px; box-shadow: 0 1px 2px rgba(11,35,64,.04); min-width: 0; }
.t-cab { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
.t-cab h2 { margin: 0; font-size: 16px; font-weight: 700; }
.t-cab p { margin: 2px 0 0; font-size: 13px; color: var(--tx-3); }
.etq { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }

/* Destacado en navy */
.heroe { position: relative; overflow: hidden; border-radius: 20px; padding: 22px; color: #fff; background:
  radial-gradient(120% 140% at 100% 0%, rgba(213,160,111,.38) 0%, rgba(213,160,111,0) 46%),
  radial-gradient(90% 120% at 0% 100%, rgba(14,148,136,.28) 0%, rgba(14,148,136,0) 50%),
  linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); box-shadow: 0 14px 34px rgba(11,35,64,.22); }
.heroe .etq { color: var(--champan); }
.heroe-valor { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.heroe-valor .moneda { font-family: var(--f-serif); font-size: 26px; color: var(--champan); }
.heroe-valor .monto { font-family: var(--f-serif); font-weight: 700; font-size: clamp(40px, 6vw, 56px); line-height: 1; letter-spacing: -.01em; }
.pildora-sube { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: rgba(16,185,129,.18); color: #A7F3D0; font-weight: 600; font-size: 14px; }
.heroe .sub { margin-top: 6px; color: rgba(255,255,255,.78); font-size: 14px; }
.comparador { margin-top: 18px; display: grid; gap: 10px; }
.comparador .fila-c { display: grid; grid-template-columns: 92px minmax(0,1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.comparador .barra { height: 12px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
.comparador .barra i { display: block; height: 100%; border-radius: 999px; }
.comparador .lbl { color: rgba(255,255,255,.78); }
.comparador .val { font-weight: 600; }
.heroe-pie { margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.12); display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: rgba(255,255,255,.88); }
.heroe-pie svg { color: var(--champan); margin-top: 2px; }

/* Indicadores */
.kpi { display: flex; flex-direction: column; gap: 6px; }
.kpi-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kpi-ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; }
.kpi-ic svg { width: 18px; height: 18px; }
.kpi-val { font-family: var(--f-serif); font-weight: 700; font-size: 30px; line-height: 1.1; }
.kpi-val small { font-family: var(--f-sans); font-weight: 500; font-size: 13px; color: var(--tx-3); margin-left: 4px; }
.kpi-det { font-size: 13px; color: var(--tx-2); }
.var { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.var svg { width: 14px; height: 14px; }
.var.sube { background: var(--ok-bg); color: var(--ok); }
.var.baja { background: var(--error-bg); color: var(--error); }
.var.igual { background: rgba(11,35,64,.06); color: var(--tx-2); }
.mini-comp { margin-top: 6px; display: grid; gap: 4px; }
.mini-comp div { display: grid; grid-template-columns: 54px minmax(0,1fr); gap: 8px; align-items: center; font-size: 12px; color: var(--tx-3); }
.mini-comp span.b { height: 6px; border-radius: 999px; background: rgba(11,35,64,.06); overflow: hidden; }
.mini-comp span.b i { display: block; height: 100%; border-radius: 999px; }

/* Leyendas y chips */
.leyenda { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--tx-2); }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip svg { width: 14px; height: 14px; }

.grafico { display: block; overflow: visible; max-width: none; }
/* Los gráficos se dibujan al ancho real de su contenedor (como ResponsiveContainer de Recharts):
   el texto conserva su tamaño en cualquier pantalla. Bajo su ancho mínimo, se desplazan dentro de la tarjeta. */
.g-hueco { overflow-x: auto; overflow-y: hidden; }
.tarjeta.cq { container-type: inline-size; }
.grafico text { font-family: var(--f-sans); }
.resumen-turnos { margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.turno { border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.turno b { font-family: var(--f-serif); font-size: 22px; font-weight: 700; }
.turno span { font-size: 13px; color: var(--tx-2); }

/* Dona */
.dona-caja { display: flex; flex-direction: column; gap: 18px; align-items: center; }
.dona-caja svg { width: 168px; height: 168px; flex: none; }
.lista-medios { width: 100%; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.m-barra { display: block; height: 6px; border-radius: 999px; background: rgba(11,35,64,.06); margin-top: 6px; overflow: hidden; }
.m-barra i { display: block; height: 100%; border-radius: 999px; }
@container (min-width: 440px) {
  .dona-caja { flex-direction: row; justify-content: center; gap: 28px; }
  .lista-medios { flex: 1 1 0; max-width: 440px; }
}
@container (min-width: 680px) {
  .dona-caja svg { width: 200px; height: 200px; }
  .lista-medios { max-width: 520px; }
}
.medio { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 10px; align-items: center; }
.medio .m-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
.medio b { display: block; font-size: 14px; }
.medio small { font-size: 12px; color: var(--tx-3); }
.medio .pct { text-align: right; }
.medio .pct strong { display: block; font-size: 16px; }

/* Barra apilada 100 % */
.apilada { display: flex; height: 18px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--blanco); }
.apilada i { display: block; height: 100%; }
.apilada i:first-child { border-radius: 999px 0 0 999px; }
.apilada i:last-child { border-radius: 0 999px 999px 0; }
.lista-tipos { margin-top: 14px; display: grid; gap: 10px; }
.tipo { display: grid; grid-template-columns: 12px minmax(0,1fr) auto auto; gap: 10px; align-items: center; font-size: 14px; }
.tipo i { width: 12px; height: 12px; border-radius: 4px; }
.tipo small { color: var(--tx-3); font-size: 13px; }
.tipo .num { font-weight: 600; text-align: right; }

/* Destacados */
.destacado { display: flex; gap: 12px; align-items: flex-start; background: linear-gradient(90deg, rgba(244,215,176,.45), rgba(244,215,176,.12)); border: 1px solid var(--borde); border-radius: 14px; padding: 14px 16px; }
.destacado .d-ic { width: 34px; height: 34px; border-radius: 10px; background: var(--navy); color: var(--champan); display: grid; place-items: center; flex: none; }
.destacado b { display: block; font-size: 14px; }
.destacado p { margin: 2px 0 0; font-size: 14px; color: var(--tx-2); }

/* Cuadrantes */
.cuadrante { position: relative; overflow: hidden; border-radius: var(--r-tarjeta); padding: 16px; border: 1px solid; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cuadrante .c-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cuadrante .c-ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: #fff; }
.cuadrante .c-ic svg { width: 20px; height: 20px; }
.cuadrante h3 { margin: 0; font-size: 16px; }
.cuadrante .c-num { font-family: var(--f-serif); font-weight: 700; font-size: 30px; line-height: 1; }
.cuadrante .c-num small { font-family: var(--f-sans); font-size: 13px; font-weight: 500; color: var(--tx-2); margin-left: 4px; }
.cuadrante p { margin: 0; font-size: 13px; color: var(--tx-2); }
.cuadrante .c-pie { font-size: 13px; color: var(--tx); font-weight: 600; }
.cuadrante .c-regla { align-self: flex-start; font-size: 12px; font-weight: 600; color: var(--tx); background: rgba(255,255,255,.75); border: 1px solid var(--borde-suave); border-radius: 8px; padding: 4px 8px; }

/* Tabla */
.filtro-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.filtro-chips button { border: 1px solid var(--borde); background: var(--blanco); border-radius: 999px; padding: 0 12px; min-height: 34px; font-size: 13px; font-weight: 500; color: var(--tx-2); display: inline-flex; align-items: center; gap: 6px; }
.filtro-chips button i { width: 8px; height: 8px; border-radius: 50%; }
.filtro-chips button.activo { background: var(--navy); color: #fff; border-color: var(--navy); }
.tabla-caja { overflow-x: auto; margin: 0 -18px -18px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--tx-3); padding: 10px 12px; background: rgba(255,249,240,.9); border-block: 1px solid var(--borde-suave); white-space: nowrap; }
th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; display: inline-flex; gap: 4px; align-items: center; }
th.n, td.n { text-align: right; }
td { padding: 10px 12px; border-bottom: 1px solid var(--borde-suave); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }

function graficoHoras(W) {
  const horas = [11, ...HORAS.map(h => h[0]), 23];
  const datos = horas.map(h => HORAS.find(x => x[0] === h) || [h, 0, 0, 0]);
  const H = 260, ml = 52, mr = 8, mt = 28, mb = 30;
  const iw = W - ml - mr, ih = H - mt - mb, max = 2500;
  const band = iw / datos.length, bw = Math.min(band * 0.64, 48);
  const y = v => mt + ih - v / max * ih;
  let s = `<svg class="grafico" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas promedio por hora: la hora punta es a las 14:00 con S/ 2 362 por día">`;
  for (let t = 0; t <= max; t += 500) {
    s += `<line x1="${ml}" x2="${W - mr}" y1="${y(t)}" y2="${y(t)}" stroke="${t === 0 ? 'rgba(11,35,64,.25)' : 'rgba(11,35,64,.08)'}" stroke-width="1"/>`;
    s += `<text x="${ml - 8}" y="${y(t) + 4}" text-anchor="end" font-size="12" fill="rgba(11,35,64,.62)">${t === 0 ? '0' : nf(t)}</text>`;
  }
  datos.forEach(([h, comp, total, prom], i) => {
    const x = ml + i * band + (band - bw) / 2;
    const color = h < 18 ? C.cobre : C.azul;
    const punta = h === 14;
    if (prom > 0) {
      const top = y(prom), alto = mt + ih - top, r = Math.min(5, alto);
      s += `<path d="M${x},${mt + ih} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${mt + ih} Z" fill="${color}" opacity="${punta ? 1 : .82}"/>`;
    }
    s += `<rect x="${ml + i * band}" y="${mt}" width="${band}" height="${ih}" fill="transparent" data-tip="<b>${String(h).padStart(2, '0')}:00 a ${String(h).padStart(2, '0')}:59</b>${fila('Por día', sol(prom))}${fila('Cuentas', nf(comp))}${fila('Total', sol(total))}"/>`;
    s += `<text x="${ml + i * band + band / 2}" y="${H - 10}" text-anchor="middle" font-size="12" fill="rgba(11,35,64,.62)">${h}</text>`;
    if (punta) {
      s += `<text x="${x + bw / 2}" y="${y(prom) - 10}" text-anchor="middle" font-size="12" font-weight="700" fill="#0B2340">${sol(prom)}</text>`;
    }
  });
  return s + '</svg>';
}

function graficoMedios(comp) {
  const M = { tarjeta:['Tarjeta', 'tarjeta', C.azul], efectivo:['Efectivo', 'billete', C.cobre], billetera_digital:['Billetera digital', 'celular', C.turq] };
  const lista = RESUMEN.actual.por_medio_pago;
  const R = 62, SW = 22, circ = 2 * Math.PI * R, gap = 3;
  let off = 0, arcos = '';
  lista.forEach(m => {
    const largo = m.porcentaje / 100 * circ;
    const [nombre, , color] = M[m.medio_pago];
    arcos += `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${color}" stroke-width="${SW}" stroke-dasharray="${Math.max(largo - gap, 0)} ${circ}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)" data-tip="<b>${nombre}</b>${fila('Parte', pct(m.porcentaje))}${fila('Total', sol(m.total))}${fila('Cuentas', nf(m.comprobantes))}"/>`;
    off += largo;
  });
  const dona = `<svg viewBox="0 0 160 160" role="img" aria-label="Medios de pago: tarjeta 43 %, efectivo 37,7 %, billeteras 19,3 %">${arcos}
    <text x="80" y="76" text-anchor="middle" font-size="12" fill="rgba(11,35,64,.62)">Total</text>
    <text x="80" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2340" font-family="DM Sans">S/ 257.6 mil</text></svg>`;
  const filas = lista.map(m => {
    const [nombre, icono, color] = M[m.medio_pago];
    const ant = RESUMEN.anterior.por_medio_pago.find(x => x.medio_pago === m.medio_pago).porcentaje;
    const d = +(m.porcentaje - ant).toFixed(1);
    return `<div class="medio"><span class="m-ic" style="background:${tinte(color, .12)};color:${color}">${ic(icono, 18)}</span>
      <div><b>${nombre}</b><small class="cifra">${sol(m.total)} · ${nf(m.comprobantes)} cuentas</small><span class="m-barra"><i style="width:${m.porcentaje}%;background:${color}"></i></span></div>
      <div class="pct"><strong class="cifra">${pct(m.porcentaje)}</strong>${comp ? varPill(d, 'pts') : ''}</div></div>`;
  }).join('');
  return `<div class="dona-caja">${dona}<div class="lista-medios">${filas}</div></div>`;
}

      <div class="c-top"><h3>${c.nombre}</h3><span class="c-ic" style="background:${c.color}">${ic(c.icono, 20)}</span></div>
      <div class="c-num cifra">${porCuad(k).length}<small>platos</small></div>
      <span class="c-regla cifra">${reglaNum(k)}</span>
      <p>${c.consejo}</p>
      <span class="c-pie cifra">${pct(ing(k))} de los ingresos de platos</span>
    </article>`).join('');
  const estrellas = porCuad('estrella'), rez = porCuad('rezagado');
  return `
  <div class="destacado"><span class="d-ic">${ic('foco', 18)}</span><div><b>Lo más importante del periodo</b><p>Tus <b style="display:inline">${estrellas.length} platos imprescindibles</b> traen el ${pct(ing('estrella'), 0)} de los ingresos. Los ${rez.length} platos por revisar solo aportan el ${pct(ing('rezagado'), 0)}: son candidatos a renovar en la carta.</p></div></div>
  <div class="fila k4">${tarjetas}</div>
  <div class="fila d2-1">
    <article class="tarjeta">
      <div class="t-cab"><div><h2>Mapa de la carta</h2><p>Qué tanto se pide cada plato frente a cuánto deja por unidad</p></div>
        <div class="leyenda">${Object.values(CUAD).map(c => `<span><i style="background:${c.color};border-radius:50%"></i>${c.uno}</span>`).join('')}</div></div>
      ${hueco('matriz', 480)}
    </article>
    <article class="tarjeta cq">
      <div class="t-cab"><div><h2>Ingresos por categoría</h2><p>Parte de los ingresos de platos</p></div></div>
      <div class="apilada" style="margin-bottom:18px" role="img" aria-label="Fondos 54 %, entradas 28 %, bebidas 14 %, postres 4 %">${CATEGORIAS.map(([n, u, i, p], idx) => `<i style="width:${p}%;background:${COLS_CAT[idx]}" data-tip="<b>${n}</b>${fila('Parte', pct(p))}${fila('Ingresos', sol(i))}"></i>`).join('')}</div>
      <div class="cats">${CATEGORIAS.map(([n, u, i, p], idx) => `
        <div class="cat"><span class="cat-nombre"><i style="background:${COLS_CAT[idx]}"></i><b>${n}</b></span>
        <span class="cat-barra"><i style="width:${p / 54.1 * 100}%;background:${COLS_CAT[idx]}"></i></span>
        <span class="cat-pct cifra">${pct(p)}</span>
        <small class="cat-det cifra">${sol(i)} · ${nf(u)} unidades</small></div>`).join('')}</div>
      <div class="mozo-pie" style="margin-top:16px;background:${tinte(C.azul, .07)};color:var(--tx-2)">${ic('info')}<span>Las bebidas son el 34 % de las unidades pero el 14 % de los ingresos.</span></div>
    </article>
  </div>
  <article class="tarjeta">
    <div class="t-cab"><div><h2>Ranking de platos</h2><p>Ordenado por ${{ ingreso: 'ingresos', unidades: 'unidades vendidas', margen: 'margen por unidad', ganancia: 'rentabilidad' }[ordenPor]}</p></div>
      <div class="filtro-chips" id="filtroCuad">
        <button data-c="todos" class="${filtroCuad === 'todos' ? 'activo' : ''}">Todos · 20</button>
        ${Object.entries(CUAD).map(([k, c]) => `<button data-c="${k}" class="${filtroCuad === k ? 'activo' : ''}"><i style="background:${c.color}"></i>${c.nombre} · ${porCuad(k).length}</button>`).join('')}
      </div></div>
    <div class="leyenda-est">${ic('info')}<span><b>Rentabilidad:</b> compara cuánto deja cada plato en total (unidades × margen por unidad). El 20 % que más deja tiene 5 estrellas, el siguiente 20 % tiene 4, y así hasta 1 estrella.</span></div>
    ${tablaRanking()}
  </article>`;
}

function graficoMatriz(W) {
  const H = Math.round(Math.min(440, Math.max(320, W * 0.5))), ml = 54, mr = 14, mt = 14, mb = 50;
  const iw = W - ml - mr, ih = H - mt - mb, xmax = 10, ymax = 40;
  const x = v => ml + v / xmax * iw, y = v => mt + ih - v / ymax * ih;
  const ux = x(UMBRALES.popularidad), uy = y(UMBRALES.margen);
  let s = `<svg class="grafico" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de la carta: popularidad frente a margen por unidad, con cuatro cuadrantes">`;
  const zonas = [
    [ux, mt, x(xmax) - ux, uy - mt, CUAD.estrella, 'end', x(xmax) - 10, mt + 20],
    [ux, uy, x(xmax) - ux, mt + ih - uy, CUAD.caballito, 'end', x(xmax) - 10, mt + ih - 12],
    [ml, mt, ux - ml, uy - mt, CUAD.puzle, 'start', ml + 10, mt + 20],
    [ml, uy, ux - ml, mt + ih - uy, CUAD.rezagado, 'start', ml + 10, mt + ih - 12]
  ];
  zonas.forEach(([zx, zy, zw, zh, c, anc, tx, ty]) => {
    s += `<rect x="${zx}" y="${zy}" width="${zw}" height="${zh}" fill="${tinte(c.color, .07)}"/>`;
    s += `<text x="${tx}" y="${ty}" text-anchor="${anc}" font-size="13" font-weight="700" fill="${c.color === C.oro ? '#8A6208' : c.color}">${c.nombre}</text>`;
  });
  for (let t = 0; t <= ymax; t += 10) s += `<text x="${ml - 8}" y="${y(t) + 4}" text-anchor="end" font-size="12" fill="rgba(11,35,64,.62)">${t === 0 ? 'S/ 0' : 'S/ ' + t}</text>`;
  for (let t = 0; t <= xmax; t += 2) s += `<text x="${x(t)}" y="${mt + ih + 18}" text-anchor="middle" font-size="12" fill="rgba(11,35,64,.62)">${t} %</text>`;
  s += `<line x1="${ux}" x2="${ux}" y1="${mt}" y2="${mt + ih}" stroke="rgba(11,35,64,.35)" stroke-dasharray="4 4"/>`;
  s += `<line x1="${ml}" x2="${W - mr}" y1="${uy}" y2="${uy}" stroke="rgba(11,35,64,.35)" stroke-dasharray="4 4"/>`;
  s += `<line x1="${ml}" x2="${W - mr}" y1="${mt + ih}" y2="${mt + ih}" stroke="rgba(11,35,64,.25)"/>`;
  s += `<text x="${ml + iw / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="rgba(11,35,64,.72)">Popularidad: parte de las unidades vendidas</text>`;
  s += `<text x="${W - mr}" y="${uy - 6}" text-anchor="end" font-size="12" fill="rgba(11,35,64,.62)">margen medio S/ ${nf(UMBRALES.margen, 2)}</text>`;
  const etiquetas = { 'Lomo Saltado Criollo':'end', 'Jalea Mixta':'start', 'Cerveza Cusqueña':'end', 'Tacu Tacu con Lomo':'start', 'Leche de Tigre':'start' };
  PRODUCTOS.forEach(p => {
    const c = CUAD[p.clas], px = x(p.part), py = y(p.mu);
    s += `<circle cx="${px}" cy="${py}" r="7" fill="${c.color}" stroke="#fff" stroke-width="2"/>`;
    s += `<circle cx="${px}" cy="${py}" r="14" fill="transparent" data-tip="<b>${p.nombre}</b>${fila('Grupo', c.uno)}${fila('Popularidad', pct(p.part))}${fila('Margen por unidad', sol(p.mu, 2))}${fila('Unidades', nf(p.unidades))}"/>`;
    if (etiquetas[p.nombre]) {
      const a = etiquetas[p.nombre];
      s += `<text x="${px + (a === 'end' ? -12 : 12)}" y="${py + 4}" text-anchor="${a}" font-size="12" font-weight="600" fill="#0B2340" stroke="#fff" stroke-width="3" paint-order="stroke">${p.nombre}</text>`;
    }
  });
  s += `<text transform="translate(14 ${mt + ih / 2}) rotate(-90)" text-anchor="middle" font-size="12" fill="rgba(11,35,64,.72)">Margen por unidad</text>`;
  return s + '</svg>';
}

function estrellasHtml(p) {
  let s = '';
  for (let i = 1; i <= 5; i++) {
    const lleno = i <= p.estrellas;
    s += `<svg viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;fill:${lleno ? '#C98F12' : 'none'};stroke:${lleno ? '#C98F12' : 'rgba(11,35,64,.3)'};stroke-width:2;stroke-linejoin:round">${P.estrella}</svg>`;
  }
  return `<span class="estrellas" role="img" aria-label="${p.estrellas} de 5 estrellas" data-tip="<b>${p.nombre}</b>${fila('Rentabilidad', p.estrellas + ' de 5')}${fila('Deja en total', sol(p.ganancia))}">${s}</span>`;
}
function paginador(total, inicio, paginas) {
  const fin = Math.min(inicio + tamPag, total);
  return `<div class="pag"><span class="cifra">Mostrando ${total ? inicio + 1 : 0}–${fin} de ${total} platos</span>
    <div class="pag-ctl"><label for="tamPag">Por página</label>
      <select id="tamPag">${[5, 10, 20].map(n => `<option value="${n}"${n === tamPag ? ' selected' : ''}>${n}</option>`).join('')}</select>
      <button data-pag="prev"${pagina <= 1 ? ' disabled' : ''}>Anterior</button>
      <span class="cifra">Página ${pagina} de ${paginas}</span>
      <button data-pag="next"${pagina >= paginas ? ' disabled' : ''}>Siguiente</button></div></div>`;
}
function tablaRanking() {
  const ORDEN = { unidades: p => p.unidades, margen: p => p.mu, ganancia: p => p.ganancia, ingreso: p => p.ingreso };
  const todos = PRODUCTOS.filter(p => filtroCuad === 'todos' || p.clas === filtroCuad).slice().sort((a, b) => ORDEN[ordenPor](b) - ORDEN[ordenPor](a));
  const paginas = Math.max(1, Math.ceil(todos.length / tamPag));
  pagina = Math.min(pagina, paginas);
  const inicio = (pagina - 1) * tamPag;
  const lista = todos.slice(inicio, inicio + tamPag);
  const maxU = Math.max(...PRODUCTOS.map(p => p.unidades));
  const insignia = p => { const c = CUAD[p.clas]; return `<span class="chip" style="background:${tinte(c.color, .12)};color:${c.color === C.oro ? '#8A6208' : c.color}">${ic(c.icono, 14)}${c.uno}</span>`; };
  const cab = (k, t) => `<th class="n"><button data-orden="${k}">${t}${ordenPor === k ? ic('orden', 12) : ''}</button></th>`;
  return `<div class="tabla-desk"><div class="tabla-caja"><table>
    <thead><tr><th style="width:44px">#</th><th>Plato</th>${cab('unidades', 'Unidades')}${cab('ingreso', 'Ingresos')}${cab('margen', 'Margen por unidad')}${cab('ganancia', 'Rentabilidad')}<th>Grupo</th></tr></thead>
    <tbody>${lista.map((p, i) => `<tr>
      <td><span class="pos">${inicio + i + 1}</span></td>
      <td><div class="plato"><b>${p.nombre}</b><small>${p.categoria}</small></div></td>
      <td class="n"><div class="barra-celda"><span class="cifra">${nf(p.unidades)}</span><span class="b"><i style="width:${p.unidades / maxU * 100}%"></i></span></div></td>
      <td class="n cifra" style="font-weight:600">${sol(p.ingreso)}</td>
      <td class="n cifra">${sol(p.mu, 2)}</td>
      <td class="n">${estrellasHtml(p)}</td>
      <td>${insignia(p)}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="lista-movil">${lista.map((p, i) => `<div class="item-movil"><span class="pos">${inicio + i + 1}</span>
      <div style="min-width:0"><b>${p.nombre}</b><small class="cifra">${nf(p.unidades)} u · ${sol(p.mu, 2)} por unidad</small><div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${estrellasHtml(p)}${insignia(p)}</div></div>
      <b class="cifra">${sol(p.ingreso)}</b></div>`).join('')}</div>${paginador(todos.length, inicio, paginas)}`;
}

/* ---------- Vista: Equipo ---------- */
function vistaEquipo() {
  const total = MOZOS.reduce((s, m) => s + m[2], 0);
  const ticketLocal = RESUMEN.actual.ticket_promedio;
  const colores = [C.azul, C.cobre, C.turq];
  const tarjetas = MOZOS.map(([nombre, comp, ventas, ticket, comensales, anul], i) => {
    const ini = nombre.split(' ').map(x => x[0]).join('');
    const puesto = i === 0 ? `<span class="puesto" style="background:${tinte(C.oro, .16)};color:#8A6208">${ic('trofeo', 14)}1.º</span>` : `<span class="puesto" style="background:var(--marfil);color:var(--tx-2)">${i + 1}.º</span>`;
    const pie = anul === 0
      ? `<div class="mozo-pie" style="background:var(--ok-bg);color:var(--ok)">${ic('escudo')}<span>Sin anulaciones en el periodo</span></div>`
      : `<div class="mozo-pie" style="background:var(--alerta-bg);color:var(--alerta)">${ic('alerta')}<span>${anul} comprobante anulado</span></div>`;
    return `<article class="tarjeta mozo">${puesto}
      <div class="mozo-top"><span class="avatar" style="background:${colores[i]}">${ini}</span><div><h3>${nombre}</h3><small>Mozo · ${nf(comp)} cuentas</small></div></div>
      <div><span class="etq" style="color:var(--tx-2)">Ventas</span><div class="mozo-ventas cifra">${sol(ventas)}</div></div>
      <div class="cuota"><span class="b"><i style="width:${ventas / total * 100 * 2.4}%;background:${colores[i]}"></i></span><small class="cifra">${pct(ventas / total * 100)} de las ventas de la sede</small></div>
      <div class="stats">
        <div class="stat"><small>Ticket</small><b class="cifra">${sol(ticket, 0)}</b></div>
        <div class="stat"><small>Comensales</small><b class="cifra">${nf(comensales)}</b></div>
        <div class="stat"><small>Por mesa</small><b class="cifra">${nf(comensales / comp, 1)}</b></div>
      </div>${pie}</article>`;
  }).join('');
  return `
  <div class="destacado"><span class="d-ic">${ic('foco', 18)}</span><div><b>Lo más importante del periodo</b><p><b style="display:inline">Diego Salas</b> lidera con el ${pct(MOZOS[0][2] / total * 100)} de las ventas y el ticket más alto. Los tres mozos están a menos del 3 % del ticket promedio de la sede, así que el equipo vende parejo.</p></div></div>
  <div class="fila d3">${tarjetas}</div>
  <div class="fila d1-1">
    <article class="tarjeta"><div class="t-cab"><div><h2>Ventas por mozo</h2><p>En soles, en el periodo</p></div></div>${hueco('mozos', 300)}</article>
    <article class="tarjeta"><div class="t-cab"><div><h2>Ticket promedio frente a la sede</h2><p>La línea marca el promedio de la sede: ${sol(ticketLocal, 2)}</p></div></div>${hueco('ticket', 300)}</article>
  </div>
  <article class="tarjeta">
    <div class="t-cab"><div><h2>Anulaciones antes del cobro</h2><p>Platos retirados de una comanda, por mozo</p></div></div>
    <div class="mozo-pie" style="background:var(--ok-bg);color:var(--ok)">${ic('escudo')}<span>Ningún mozo anuló platos en este periodo. Cuando ocurra, aquí verás cuántos, el monto y el costo de lo que se perdió en cocina.</span></div>
  </article>`;
}

function barrasMozos(colores, W) {
  const max = 100000, fh = 30, ml = 110, mr = 76, H = MOZOS.length * (fh + 16) + 8;
  let s = `<svg class="grafico" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por mozo">`;
  MOZOS.forEach(([n, c, v], i) => {
    const y = 4 + i * (fh + 16), w = v / max * (W - ml - mr);
    s += `<text x="${ml - 10}" y="${y + fh / 2 + 4}" text-anchor="end" font-size="13" fill="#0B2340">${n}</text>`;
    s += `<rect x="${ml}" y="${y}" width="${W - ml - mr}" height="${fh}" rx="8" fill="rgba(11,35,64,.04)"/>`;
    s += `<rect x="${ml}" y="${y}" width="${w}" height="${fh}" rx="8" fill="${colores[i]}" data-tip="<b>${n}</b>${fila('Ventas', sol(v))}${fila('Cuentas', nf(c))}"/>`;
    s += `<text x="${ml + w + 8}" y="${y + fh / 2 + 4}" font-size="13" font-weight="700" fill="#0B2340">${sol(v / 1000, 1)} mil</text>`;
  });
  return s + '</svg>';
}

function ticketMozos(colores, ref, W) {
  const ml = 110, mr = 24, fila_h = 44, H = MOZOS.length * fila_h + 36, min = 200, max = 250;
  const x = v => ml + (v - min) / (max - min) * (W - ml - mr);
  let s = `<svg class="grafico" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ticket promedio por mozo frente al de la sede">`;
  for (let t = min; t <= max; t += 10) s += `<text x="${x(t)}" y="${H - 6}" text-anchor="middle" font-size="12" fill="rgba(11,35,64,.62)">S/ ${t}</text>`;
  s += `<line x1="${x(ref)}" x2="${x(ref)}" y1="4" y2="${H - 24}" stroke="${C.cobre}" stroke-width="2" stroke-dasharray="5 4"/>`;
  MOZOS.forEach(([n, , , t], i) => {
    const y = 24 + i * fila_h;
    s += `<text x="${ml - 10}" y="${y + 4}" text-anchor="end" font-size="13" fill="#0B2340">${n}</text>`;
    s += `<line x1="${x(ref)}" x2="${x(t)}" y1="${y}" y2="${y}" stroke="${colores[i]}" stroke-width="3" stroke-linecap="round"/>`;
    s += `<circle cx="${x(t)}" cy="${y}" r="8" fill="${colores[i]}" stroke="#fff" stroke-width="2" data-tip="<b>${n}</b>${fila('Ticket', sol(t, 2))}${fila('Frente a la sede', (t >= ref ? '+' : '') + sol(t - ref, 2))}"/>`;
    s += `<text x="${x(t) + (t >= ref ? 14 : -14)}" y="${y + 4}" text-anchor="${t >= ref ? 'start' : 'end'}" font-size="12" font-weight="700" fill="#0B2340">${sol(t, 2)}</text>`;
  });
  return s + '</svg>';
}

/* ---------- Estados ---------- */
const esqueleto = () => `
  <div class="esq" style="height:70px"></div>
  <div class="fila h-k"><div class="esq" style="height:300px;border-radius:20px"></div>
    <div class="fila k4" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))">${'<div class="esq" style="height:142px"></div>'.repeat(4)}</div></div>
  <div class="fila d2-1"><div class="esq" style="height:340px"></div><div class="esq" style="height:340px"></div></div>`;
const vacio = () => `<div class="tarjeta estado">
  <span class="e-ic" style="background:${tinte(C.cobre, .14)};color:${C.cobre}">${ic('recibo', 30)}</span>
  <h2>Todavía no hay ventas en este periodo</h2>
  <p>Cuando cobres la primera cuenta, aquí verás las ventas, los platos y el trabajo del equipo. Las ventas aparecen unos segundos después del cobro.</p>
  <button class="btn contorno">${ic('calendario')}Ver el mes anterior</button></div>`;
const error = () => `<div class="tarjeta estado">
  <span class="e-ic" style="background:var(--error-bg);color:var(--error)">${ic('alerta', 30)}</span>
  <h2>No pudimos cargar los reportes</h2>
  <p>El servicio de reportes no responde en este momento. Tus ventas siguen guardándose y aparecerán aquí cuando vuelva.</p>
  <button class="btn primario">${ic('recargar')}Reintentar</button></div>`;
const bloqueado = (contenido, cual) => `<div class="bloqueo"><div class="vista-borrosa" aria-hidden="true">${contenido}</div>
  <div class="sobre"><div class="panel">
    <span class="e-ic" style="width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:${tinte(C.oro, .16)};color:#8A6208">${ic('candado', 26)}</span>
    <h2 style="margin:4px 0 0;font-family:var(--f-serif);font-size:22px">${cual === 'platos' ? 'Descubre qué platos te hacen ganar' : 'Conoce cómo vende tu equipo'}</h2>
    <ul>${(cual === 'platos' ? ['El mapa de la carta con tus estrellas y rezagados', 'Qué platos dejan más margen por unidad', 'Ingresos por categoría'] : ['Ventas y ticket de cada mozo', 'Comparación con el promedio de la sede', 'Anulaciones por mozo']).map(t => `<li>${ic('check')}${t}</li>`).join('')}</ul>
    <button class="btn primario">Ver planes</button>
    <small style="color:var(--tx-3)">Incluido en los planes Pro y Enterprise</small>
  </div></div></div>`;

/* ---------- Render ---------- */
function render() {
  pintarTabs();
  const t = tabActual(), v = document.getElementById('vista');
  if (estado === 'cargando') { v.innerHTML = esqueleto(); return; }
  if (estado === 'vacio') { v.innerHTML = vacio(); return; }
  if (estado === 'error') { v.innerHTML = error(); return; }
  const html = t === 'platos' ? vistaPlatos() : t === 'equipo' ? vistaEquipo() : vistaVentas();
  v.innerHTML = estado === 'plan' && t !== 'ventas' ? bloqueado(html, t) : html;
  dibujarGraficos();
}

/* ---------- Gráficos al ancho real del contenedor ---------- */
const COLORES_MOZOS = [C.azul, C.cobre, C.turq];
const GRAF = {
  horas: W => graficoHoras(W),
  matriz: W => graficoMatriz(W),
  mozos: W => barrasMozos(COLORES_MOZOS, W),
  ticket: W => ticketMozos(COLORES_MOZOS, RESUMEN.actual.ticket_promedio, W)
};
function dibujarGraficos() {
  document.querySelectorAll('.g-hueco').forEach(el => {
    const w = Math.max(Math.floor(el.clientWidth), +el.dataset.min);
    if (+el.dataset.w === w) return;
    el.dataset.w = w;
    el.innerHTML = GRAF[el.dataset.g](w);
  });
}
let rafGraficos;
new ResizeObserver(() => { cancelAnimationFrame(rafGraficos); rafGraficos = requestAnimationFrame(dibujarGraficos); })
  .observe(document.getElementById('vista'));
document.getElementById('vista').addEventListener('click', e => {
  const c = e.target.closest('#filtroCuad [data-c]');
  if (c) { filtroCuad = c.dataset.c; pagina = 1; render(); return; }
  const o = e.target.closest('[data-orden]');
  if (o) { ordenPor = o.dataset.orden; pagina = 1; render(); return; }
  const g = e.target.closest('[data-pag]');
  if (g) { pagina += g.dataset.pag === 'next' ? 1 : -1; render(); }
});
document.getElementById('vista').addEventListener('change', e => {
  if (e.target.id === 'tamPag') { tamPag = +e.target.value; pagina = 1; render(); }
});
render();
</script>
