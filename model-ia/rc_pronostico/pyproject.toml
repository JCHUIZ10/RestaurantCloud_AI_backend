[project]
name = "rc-pronostico"
version = "0.1.0"
description = "Cálculo de variables, reglas y carga del artefacto de pronóstico (compartido con ms-pronóstico)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn==1.7.2",
    "skops==0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rc_pronostico"]
